name: CI

# NOTE: This file lives at ci/github-workflows/e2e.yml instead of
# .github/workflows/e2e.yml because the automation that produced it does not
# have permission to write under .github/workflows. A human maintainer needs
# to move this file to .github/workflows/e2e.yml (e.g.
# `git mv ci/github-workflows/e2e.yml .github/workflows/e2e.yml`) for it to
# actually run on GitHub Actions.

on:
  push:
    branches:
      - main
      - 'builder/**'
  pull_request:
    branches:
      - main
      - 'builder/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
